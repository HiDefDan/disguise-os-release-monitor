# Temporary one-off: inspect the legacy products page structure. Will be deleted.
name: probe-legacy
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: |
          cat > probe.mjs <<'JS'
          const res = await fetch('https://www.disguise.one/en/products/legacy-products', { headers: { 'user-agent': 'disguise-os-release-monitor (GitHub Actions)' } });
          const html = await res.text();
          console.log('HTTP', res.status, 'final URL', res.url, 'length', html.length);
          console.log('== headings ==');
          for (const m of html.matchAll(/<h([1-6])[^>]*>([\s\S]*?)<\/h\1>/g)) console.log(`h${m[1]}: ${m[2].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()}`);
          console.log('== product links ==');
          console.log([...new Set([...html.matchAll(/href="([^"]*products[^"]*)"/g)].map(m => m[1]))].join('\n'));
          console.log('== script/json hints ==', (html.match(/__NEXT_DATA__|__NUXT__|application\/ld\+json|window\.__/g) ?? []).join(' '));
          const text = html.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<\/(p|li|div|h\d|a|span)>/g, '\n').replace(/<[^>]+>/g, ' ')
            .split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
          console.log('== visible text (first 250 lines) ==');
          console.log(text.slice(0, 250).join('\n'));
          JS
          node probe.mjs
