# GitHub disables scheduled workflows after 60 days without repository activity.
# Disguise releases roughly quarterly, so this makes a tiny commit once a month.
name: keepalive
on:
  schedule:
    - cron: '41 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name  "os-watch"
          git config user.email "os-watch@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore(keepalive): monthly activity commit"
          git push
