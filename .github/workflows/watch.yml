name: disguise-os-watch
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      page_url:
        description: 'Override page URL (testing only, leave blank)'
        required: false
        default: ''
permissions:
  contents: write
  issues: write
concurrency:
  group: disguise-os-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node watch.mjs
        env:
          PAGE_URL: ${{ inputs.page_url }}
      # Raise the issue before committing state: if issue creation fails, the state stays
      # unchanged and the next run retries, rather than the alert being lost.
      - name: Raise issue
        if: hashFiles('changes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat issue-title.txt)" --body-file changes.md
      - name: Commit state
        run: |
          git config user.name  "os-watch"
          git config user.email "os-watch@users.noreply.github.com"
          git add latest.json LATEST.md
          if [ -f legacy.json ]; then git add legacy.json; fi
          git diff --cached --quiet || { git commit -m "chore(data): update latest OS images"; git push; }
      # The legacy products page is secondary: OS alerts and state are handled above even if it
      # failed, then the run is marked failed here so the problem is still noticed.
      - name: Report legacy page problem
        if: hashFiles('legacy-error.txt') != ''
        run: |
          echo "::error::$(cat legacy-error.txt)"
          exit 1
