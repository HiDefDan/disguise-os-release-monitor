name: disguise-os-watch
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      page_url:
        description: 'Override page URL (testing only, leave blank)'
        required: false
        default: ''
      test_push:
        description: 'Send a test push to the Notify! app'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: disguise-os-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node watch.mjs
        env:
          PAGE_URL: ${{ inputs.page_url }}
      # Raise the issue before committing state: if issue creation fails, the state stays
      # unchanged and the next run retries, rather than the alert being lost.
      - name: Raise issue
        if: hashFiles('changes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat issue-title.txt)" --body-file changes.md
      - name: Send push notifications
        env:
          NOTIFY_DEVICE_ID: ${{ secrets.NOTIFY_DEVICE_ID }}
          NOTIFY_DEVICE_TOKEN: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          NOTIFY_PLATFORMS: ${{ vars.NOTIFY_PLATFORMS }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: node notify.mjs
      - name: Commit state
        run: |
          git config user.name  "os-watch"
          git config user.email "os-watch@users.noreply.github.com"
          git add latest.json LATEST.md
          for f in legacy.json compatibility.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || { git commit -m "chore(data): update watched state"; git push; }
      # The legacy and compatibility pages and push delivery are secondary: the issue and state
      # are handled above even if any of them failed, then the run is marked failed here.
      - name: Report problems
        if: hashFiles('source-errors.txt', 'notify-error.txt') != ''
        run: |
          for f in source-errors.txt notify-error.txt; do
            if [ -f "$f" ]; then echo "::error::$(cat "$f")"; fi
          done
          exit 1
